<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Search Puzzle Generator</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #111;
        display: flex;
        min-height: 100vh;
        align-items: flex-start;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .app {
        width: min(100%, 1400px);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 20px;
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }
      .sidebar {
        width: 260px;
        flex-shrink: 0;
      }
      .canvas-panel {
        flex: 1;
        min-width: 0;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }
      .field label {
        font-size: 14px;
        font-weight: 700;
      }
      .field-hint {
        margin: 0;
        font-size: 12px;
        color: #666;
      }
      .field input,
      .field textarea {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        font-family: "Courier New", monospace;
        resize: vertical;
      }
      .field input[type="number"] {
        font-family: inherit;
        width: 80px;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
        user-select: none;
      }
      .checkbox-label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #1f6feb;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 16px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: #1f6feb;
        width: 100%;
      }
      button:hover {
        background: #185abc;
      }
      .canvas-wrap {
        overflow: auto;
        border: 1px solid #e5e5e5;
        border-radius: 10px;
      }
      .status {
        min-height: 20px;
        margin-bottom: 10px;
        color: #b00020;
        font-size: 14px;
        font-weight: 600;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="field">
          <label for="titleInput">Puzzle title</label>
          <input id="titleInput" type="text" value="Word Search" />
        </div>
        <div class="field">
          <label for="termsTextarea">Words &amp; hints</label>
          <p class="field-hint">
            Each line: WORD hint text (uppercase letters at start = word)
          </p>
          <textarea id="termsTextarea" rows="12" spellcheck="false">
BIOFILM A protective microbial community attached to food contact surfaces that resists sanitizers
SPORES Dormant heat-resistant survival structures produced by certain bacteria
LISTERIA A foodborne pathogen that can survive and grow under refrigeration temperature
BACILLUSCEREUS A spore-forming foodborne bacterium commonly associated with cooked rice</textarea
          >
        </div>
        <div class="field">
          <label for="paddingInput">Grid padding</label>
          <input id="paddingInput" type="number" min="1" max="20" value="2" />
        </div>
        <div class="field">
          <label class="checkbox-label">
            <input type="checkbox" id="allowReverseCheck" />
            Allow reversed words
          </label>
        </div>
        <div class="controls">
          <button id="generateBtn" type="button">Generate New Puzzle</button>
          <button id="toggleBtn" type="button">Show Answers</button>
          <button id="downloadBtn" type="button">Download Image</button>
        </div>
        <div id="statusMsg" class="status" aria-live="polite"></div>
      </aside>
      <section class="canvas-panel">
        <div class="canvas-wrap">
          <canvas
            id="puzzleCanvas"
            aria-label="Word search puzzle grid"
          ></canvas>
        </div>
      </section>
    </main>

    <script>
      const DEFAULT_TITLE = "Word Search";
      const CANVAS_WIDTH = 1200;
      const MAX_CELL_SIZE = 42;
      const MIN_CELL_SIZE = 18;
      const MAX_ATTEMPTS_PER_WORD = 300;
      const MAX_FULL_PUZZLE_ATTEMPTS = 50;
      const ORIENTATIONS_FORWARD = [
        { dx: 1, dy: 0 },
        { dx: 0, dy: 1 },
      ];
      const ORIENTATIONS_ALL = [
        { dx: 1, dy: 0 },
        { dx: -1, dy: 0 },
        { dx: 0, dy: 1 },
        { dx: 0, dy: -1 },
      ];
      const ANSWER_PALETTE = [
        { fill: "rgba(220,50,50,0.2)", stroke: "rgba(200,30,30,0.9)" },
        { fill: "rgba(30,140,200,0.2)", stroke: "rgba(20,110,180,0.9)" },
        { fill: "rgba(30,160,100,0.2)", stroke: "rgba(20,130,80,0.9)" },
        { fill: "rgba(160,60,200,0.2)", stroke: "rgba(130,40,170,0.9)" },
        { fill: "rgba(200,130,10,0.25)", stroke: "rgba(170,100,0,0.9)" },
        { fill: "rgba(20,160,160,0.2)", stroke: "rgba(10,130,130,0.9)" },
        { fill: "rgba(220,80,150,0.2)", stroke: "rgba(190,50,120,0.9)" },
        { fill: "rgba(80,120,200,0.2)", stroke: "rgba(50,90,180,0.9)" },
        { fill: "rgba(50,170,80,0.2)", stroke: "rgba(30,140,60,0.9)" },
        { fill: "rgba(200,80,30,0.2)", stroke: "rgba(170,50,10,0.9)" },
      ];
      const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      const canvas = document.getElementById("puzzleCanvas");
      const ctx = canvas.getContext("2d");
      const generateBtn = document.getElementById("generateBtn");
      const toggleBtn = document.getElementById("toggleBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const titleInput = document.getElementById("titleInput");
      const termsTextarea = document.getElementById("termsTextarea");
      const paddingInput = document.getElementById("paddingInput");
      const allowReverseCheck = document.getElementById("allowReverseCheck");
      const statusMsg = document.getElementById("statusMsg");

      let grid = [];
      let solutionMap = [];
      let currentTerms = [];
      let currentGridSize = 10;
      let showAnswers = false;
      let puzzleTitle = DEFAULT_TITLE;

      function parseTerms(text) {
        return text
          .split("\n")
          .map((line) => line.trim())
          .filter((line) => line.length > 0)
          .map((line) => {
            const match = line.match(/^([A-Z]+)(.*)/);
            if (!match || match[1].length === 0) return null;
            return { word: match[1], hint: match[2].trim() };
          })
          .filter(Boolean);
      }

      function computeGridSize(words, padding) {
        if (words.length === 0) return 10;
        const maxLen = Math.max(...words.map((w) => w.length));
        return maxLen + padding * 2;
      }

      function computeCellSize(gridSize) {
        const available = CANVAS_WIDTH - 80;
        return Math.max(
          MIN_CELL_SIZE,
          Math.min(MAX_CELL_SIZE, Math.floor(available / gridSize)),
        );
      }

      function makeEmptyGrid(size) {
        return Array.from({ length: size }, () => Array(size).fill(""));
      }

      function randomInt(max) {
        return Math.floor(Math.random() * max);
      }

      function randomLetter() {
        return ALPHABET[randomInt(ALPHABET.length)];
      }

      function scorePlacement(word, x, y, dx, dy, board, gridSize) {
        let intersections = 0;
        for (let i = 0; i < word.length; i++) {
          const nx = x + i * dx;
          const ny = y + i * dy;
          if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) return null;
          const cell = board[ny][nx];
          if (cell && cell !== word[i]) return null;
          if (cell === word[i]) intersections++;
        }
        return intersections;
      }

      function placeWord(word, board, gridSize, orientations) {
        let bestScore = -1;
        let bestPlacement = null;
        for (let attempt = 0; attempt < MAX_ATTEMPTS_PER_WORD; attempt++) {
          const { dx, dy } = orientations[randomInt(orientations.length)];
          const x = randomInt(gridSize);
          const y = randomInt(gridSize);
          const score = scorePlacement(word, x, y, dx, dy, board, gridSize);
          if (score === null) continue;
          if (score > bestScore) {
            bestScore = score;
            bestPlacement = { x, y, dx, dy };
          }
        }
        if (!bestPlacement) return null;
        const { x, y, dx, dy } = bestPlacement;
        const cells = [];
        for (let i = 0; i < word.length; i++) {
          const nx = x + i * dx;
          const ny = y + i * dy;
          board[ny][nx] = word[i];
          cells.push({ x: nx, y: ny });
        }
        return { word, cells };
      }

      function fillEmptyCells(board, gridSize) {
        for (let row = 0; row < gridSize; row++) {
          for (let col = 0; col < gridSize; col++) {
            if (!board[row][col]) board[row][col] = randomLetter();
          }
        }
      }

      function generatePuzzle(terms, padding, orientations) {
        const sortedTerms = [...terms].sort(
          (a, b) => b.word.length - a.word.length,
        );
        const words = sortedTerms.map((t) => t.word);
        const gridSize = computeGridSize(words, padding);
        for (let attempt = 0; attempt < MAX_FULL_PUZZLE_ATTEMPTS; attempt++) {
          const board = makeEmptyGrid(gridSize);
          const placed = [];
          let allPlaced = true;
          for (const word of words) {
            const result = placeWord(word, board, gridSize, orientations);
            if (!result) {
              allPlaced = false;
              break;
            }
            placed.push(result);
          }
          if (!allPlaced) continue;
          fillEmptyCells(board, gridSize);
          return { grid: board, solutionMap: placed, gridSize };
        }
        throw new Error(
          `Unable to place all words after ${MAX_FULL_PUZZLE_ATTEMPTS} attempts. Try increasing the grid padding.`,
        );
      }

      // wrapTextOffset: draws text starting at (x + firstLineOffset, y) for the first
      // line, then wraps subsequent lines starting at x.
      function wrapTextOffset(
        ctx,
        text,
        x,
        firstLineOffset,
        y,
        maxWidth,
        lineHeight,
      ) {
        const words = text.split(" ");
        let line = "";
        let lineY = y;
        let isFirst = true;
        for (const word of words) {
          const test = line ? line + " " + word : word;
          const avail = isFirst ? maxWidth - firstLineOffset : maxWidth;
          if (ctx.measureText(test).width > avail && line) {
            ctx.fillText(line, isFirst ? x + firstLineOffset : x, lineY);
            line = word;
            lineY += lineHeight;
            isFirst = false;
          } else {
            line = test;
          }
        }
        if (line) {
          ctx.fillText(line, isFirst ? x + firstLineOffset : x, lineY);
          lineY += lineHeight;
        }
        return lineY;
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(" ");
        let line = "";
        let lineY = y;
        for (const word of words) {
          const test = line ? line + " " + word : word;
          if (ctx.measureText(test).width > maxWidth && line) {
            ctx.fillText(line, x, lineY);
            line = word;
            lineY += lineHeight;
          } else {
            line = test;
          }
        }
        if (line) {
          ctx.fillText(line, x, lineY);
          lineY += lineHeight;
        }
        return lineY;
      }

      function measureHintsHeight(terms, answersVisible, maxWidth, lineHeight) {
        ctx.font = "22px Arial, sans-serif";
        let total = 0;
        for (const { word, hint } of terms) {
          const text = answersVisible ? `${word} \u2014 ${hint}` : hint;
          const words = text.split(" ");
          let line = "";
          let lineCount = 1;
          for (const w of words) {
            const test = line ? line + " " + w : w;
            if (ctx.measureText(test).width > maxWidth && line) {
              lineCount++;
              line = w;
            } else {
              line = test;
            }
          }
          total += lineCount * lineHeight + 8;
        }
        return total;
      }

      function normalizeTitle(value) {
        const title = value.trim();
        return title || DEFAULT_TITLE;
      }

      function getRenderedTitle() {
        return puzzleTitle.toUpperCase();
      }

      function makeFilenameBase() {
        const slug = puzzleTitle
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
        return slug || "word-search";
      }

      function renderPuzzle() {
        if (currentTerms.length === 0 || grid.length === 0) return;

        const terms = currentTerms;
        const gridSize = currentGridSize;
        const cellSize = computeCellSize(gridSize);
        const gridPixelSize = gridSize * cellSize;

        const TITLE_FONT_SIZE = 48;
        const HEADER_HEIGHT = TITLE_FONT_SIZE + 30;
        const SUBTITLE_HEIGHT = showAnswers ? 44 : 0;
        const GRID_TOP_MARGIN = 20;
        const HINT_LINE_HEIGHT = 32;
        const HINT_MARGIN_X = 50;
        const HINTS_TOP_MARGIN = 50;
        const CANVAS_BOTTOM_MARGIN = 40;
        const maxHintWidth = CANVAS_WIDTH - HINT_MARGIN_X * 2;

        const hintsHeight = measureHintsHeight(
          terms,
          showAnswers,
          maxHintWidth,
          HINT_LINE_HEIGHT,
        );

        const gridStartY = HEADER_HEIGHT + SUBTITLE_HEIGHT + GRID_TOP_MARGIN;
        const canvasHeight =
          gridStartY +
          gridPixelSize +
          HINTS_TOP_MARGIN +
          hintsHeight +
          CANVAS_BOTTOM_MARGIN;

        canvas.width = CANVAS_WIDTH;
        canvas.height = Math.ceil(canvasHeight);

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, CANVAS_WIDTH, canvas.height);

        ctx.fillStyle = "#000000";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";

        const renderedTitle = getRenderedTitle();
        let titleFS = TITLE_FONT_SIZE;
        while (titleFS > 24) {
          ctx.font = `bold ${titleFS}px Arial, sans-serif`;
          if (ctx.measureText(renderedTitle).width <= CANVAS_WIDTH - 80) break;
          titleFS -= 2;
        }
        ctx.fillText(renderedTitle, CANVAS_WIDTH / 2, titleFS + 20);

        if (showAnswers) {
          ctx.font = "bold 28px Arial, sans-serif";
          ctx.fillText("ANSWER KEY", CANVAS_WIDTH / 2, HEADER_HEIGHT + 32);
        }

        const gridStartX = Math.floor((CANVAS_WIDTH - gridPixelSize) / 2);

        if (showAnswers) {
          solutionMap.forEach((placement, idx) => {
            const color = ANSWER_PALETTE[idx % ANSWER_PALETTE.length];
            const cells = placement.cells;
            if (cells.length === 0) return;
            const xs = cells.map((c) => c.x);
            const ys = cells.map((c) => c.y);
            const minX = Math.min(...xs);
            const minY = Math.min(...ys);
            const maxX = Math.max(...xs);
            const maxY = Math.max(...ys);
            const rx = gridStartX + minX * cellSize + 2;
            const ry = gridStartY + minY * cellSize + 2;
            const rw = (maxX - minX + 1) * cellSize - 4;
            const rh = (maxY - minY + 1) * cellSize - 4;
            ctx.beginPath();
            ctx.roundRect(rx, ry, rw, rh, 6);
            ctx.fillStyle = color.fill;
            ctx.fill();
            ctx.strokeStyle = color.stroke;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          });
        }

        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#000000";
        const gridFontSize = Math.max(12, Math.floor(cellSize * 0.72));
        ctx.font = `bold ${gridFontSize}px "Courier New", monospace`;
        const textOffsetX = Math.floor(cellSize * 0.15);

        for (let row = 0; row < gridSize; row++) {
          for (let col = 0; col < gridSize; col++) {
            const px = gridStartX + col * cellSize + textOffsetX;
            const py = gridStartY + row * cellSize + cellSize / 2;
            ctx.fillText(grid[row][col], px, py);
          }
        }

        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = "#000000";
        ctx.font = "22px Arial, sans-serif";

        const wordColorIndex = new Map();
        solutionMap.forEach((p, i) => wordColorIndex.set(p.word, i));

        let currentY = gridStartY + gridPixelSize + HINTS_TOP_MARGIN;
        ctx.textBaseline = "alphabetic";
        for (const { word, hint } of terms) {
          if (showAnswers) {
            const cidx = wordColorIndex.has(word)
              ? wordColorIndex.get(word) % ANSWER_PALETTE.length
              : 0;
            const prefix = `${word} \u2014 `;
            const prefixWidth = ctx.measureText(prefix).width;
            ctx.fillStyle = ANSWER_PALETTE[cidx].stroke;
            ctx.fillText(prefix, HINT_MARGIN_X, currentY);
            ctx.fillStyle = "#000000";
            currentY = wrapTextOffset(
              ctx,
              hint,
              HINT_MARGIN_X,
              prefixWidth,
              currentY,
              maxHintWidth,
              HINT_LINE_HEIGHT,
            );
          } else {
            currentY = wrapText(
              ctx,
              hint,
              HINT_MARGIN_X,
              currentY,
              maxHintWidth,
              HINT_LINE_HEIGHT,
            );
          }
          currentY += 8;
        }
      }

      function updateToggleLabel() {
        toggleBtn.textContent = showAnswers ? "Hide Answers" : "Show Answers";
        canvas.setAttribute(
          "aria-label",
          `${puzzleTitle} word search puzzle grid${
            showAnswers ? " - ANSWER KEY" : ""
          }`,
        );
      }

      function downloadImage() {
        const url = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        link.href = url;
        const filenameBase = makeFilenameBase();
        link.download = showAnswers
          ? `${filenameBase}-answer-key.png`
          : `${filenameBase}-word-search.png`;
        link.click();
      }

      function setStatus(message) {
        statusMsg.textContent = message;
      }

      function safeGenerateAndRender() {
        const terms = parseTerms(termsTextarea.value);
        if (terms.length === 0) {
          setStatus(
            "No valid words found. Each line should start with uppercase letters.",
          );
          return;
        }
        const padding = Math.max(1, parseInt(paddingInput.value, 10) || 2);
        const orientations = allowReverseCheck.checked
          ? ORIENTATIONS_ALL
          : ORIENTATIONS_FORWARD;
        try {
          const result = generatePuzzle(terms, padding, orientations);
          grid = result.grid;
          solutionMap = result.solutionMap;
          currentTerms = terms;
          currentGridSize = result.gridSize;
          setStatus("");
          renderPuzzle();
        } catch (err) {
          const message =
            err instanceof Error ? err.message : "Unexpected error.";
          console.error(err);
          setStatus(message);
        }
      }

      generateBtn.addEventListener("click", safeGenerateAndRender);
      allowReverseCheck.addEventListener("change", safeGenerateAndRender);

      toggleBtn.addEventListener("click", () => {
        showAnswers = !showAnswers;
        updateToggleLabel();
        renderPuzzle();
      });

      downloadBtn.addEventListener("click", downloadImage);

      titleInput.addEventListener("input", () => {
        puzzleTitle = normalizeTitle(titleInput.value);
        updateToggleLabel();
        renderPuzzle();
      });

      puzzleTitle = normalizeTitle(titleInput.value);
      updateToggleLabel();
      safeGenerateAndRender();
    </script>
  </body>
</html>
