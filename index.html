<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Search Puzzle Generator — Free &amp; Printable</title>
    <meta
      name="description"
      content="Create printable word search puzzles from your own words and hints — free, right in your browser. Answer keys, PNG download, PDF export, and shareable puzzle links."
    />
    <meta name="author" content="Chee Leong" />
    <meta name="theme-color" content="#1f6feb" />
    <link rel="canonical" href="https://cheeleong.dev/word_search_puzzle/" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Word Search Puzzle Generator" />
    <meta
      property="og:description"
      content="Create printable word search puzzles from your own words and hints — with answer keys, PNG & PDF export, and shareable links. Free, no sign-up."
    />
    <meta property="og:url" content="https://cheeleong.dev/word_search_puzzle/" />
    <meta
      property="og:image"
      content="https://cheeleong.dev/word_search_puzzle/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Word Search Puzzle Generator — a letter grid with the word PUZZLE highlighted"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Word Search Puzzle Generator" />
    <meta
      name="twitter:description"
      content="Create printable word search puzzles from your own words and hints — with answer keys, PNG & PDF export, and shareable links. Free, no sign-up."
    />
    <meta
      name="twitter:image"
      content="https://cheeleong.dev/word_search_puzzle/assets/og-image.png"
    />

    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Word Search Puzzle Generator",
        "url": "https://cheeleong.dev/word_search_puzzle/",
        "description": "Create printable word search puzzles from your own words and hints — free, right in your browser. Answer keys, PNG download, PDF export, and shareable puzzle links.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Chee Leong",
          "url": "https://cheeleong.dev"
        }
      }
    </script>
  </head>
  <body>
    <h1 class="visually-hidden">
      Word Search Puzzle Generator — free printable puzzles from your own
      words and hints
    </h1>
    <noscript>
      <p class="noscript-note">
        This free word search puzzle generator runs entirely in your browser
        and requires JavaScript. Enter your own words and hints to create a
        printable puzzle with an answer key, download it as a PNG image,
        export it as a PDF, or share it via link.
      </p>
    </noscript>
    <main class="app">
      <aside class="sidebar">
        <section class="group">
          <h2 class="group-title">Puzzle</h2>
          <div class="field">
            <label for="titleInput">Title</label>
            <input id="titleInput" type="text" value="Word Search" />
          </div>
          <div class="field">
            <label for="termsTextarea">Words &amp; hints</label>
            <textarea id="termsTextarea" rows="10" spellcheck="false">
BIOFILM A protective microbial community attached to food contact surfaces that resists sanitizers
SPORES Dormant heat-resistant survival structures produced by certain bacteria
LISTERIA A foodborne pathogen that can survive and grow under refrigeration temperature
BACILLUSCEREUS A spore-forming foodborne bacterium commonly associated with cooked rice</textarea
            >
            <p class="field-hint">
              One entry per line: <code>WORD hint text</code>, or
              <code>word &mdash; hint</code> for lowercase or multi-word
              entries.
            </p>
          </div>
        </section>

        <section class="group">
          <h2 class="group-title">Options</h2>
          <div class="inline-field">
            <label for="paddingInput">Grid padding</label>
            <input id="paddingInput" type="number" min="1" max="20" value="2" />
          </div>
          <div class="inline-field">
            <label for="hintFontSizeInput">Hint font size</label>
            <div class="range-row">
              <input
                type="range"
                id="hintFontSizeInput"
                min="14"
                max="36"
                value="22"
              />
              <span class="range-value" id="hintFontSizeValue">22</span>
            </div>
          </div>
          <label class="checkbox-label">
            <input type="checkbox" id="allowDiagonalCheck" checked />
            Allow diagonal words
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="allowReverseCheck" />
            Allow reversed words
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="shuffleHintsCheck" checked />
            Shuffle hints order
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="numberedHintsCheck" checked />
            Numbered hints mode
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="autoRegenerateCheck" />
            Auto-regenerate on edit
          </label>
        </section>

        <section class="group">
          <h2 class="group-title">Seed</h2>
          <label class="checkbox-label">
            <input type="checkbox" id="randomiseSeedCheck" checked />
            Randomise seed on each generate
          </label>
          <div class="field">
            <label for="seedInput"
              >Puzzle seed
              <span id="seedRandomHint" class="label-hint"
                >(blank = random)</span
              ></label
            >
            <input id="seedInput" type="text" placeholder="e.g. 42" disabled />
          </div>
          <details class="advanced">
            <summary>Advanced settings</summary>
            <div class="advanced-inner">
              <div class="advanced-row">
                <label for="maxAttemptsInput">Attempts per word</label>
                <input
                  type="number"
                  id="maxAttemptsInput"
                  min="50"
                  max="2000"
                  value="300"
                />
              </div>
              <div class="advanced-row">
                <label for="maxFullAttemptsInput">Full puzzle retries</label>
                <input
                  type="number"
                  id="maxFullAttemptsInput"
                  min="5"
                  max="200"
                  value="50"
                />
              </div>
            </div>
          </details>
        </section>

        <section class="group">
          <h2 class="group-title">Actions</h2>
          <div class="controls">
            <button id="generateBtn" type="button">Generate New Puzzle</button>
            <button id="toggleBtn" type="button" class="btn-secondary">
              Show Answers
            </button>
            <div class="btn-grid">
              <button id="downloadBtn" type="button" class="btn-secondary">
                Download PNG
              </button>
              <button id="exportPdfBtn" type="button" class="btn-secondary">
                Export PDF
              </button>
              <button id="shareLinkBtn" type="button" class="btn-secondary">
                Share Link
              </button>
              <button id="randomizeColorsBtn" type="button" class="btn-secondary">
                New Colors
              </button>
            </div>
            <button id="clearSavedBtn" type="button" class="btn-text">
              Clear saved data
            </button>
          </div>
          <div id="statusMsg" class="status" aria-live="polite"></div>
        </section>
      </aside>
      <section class="canvas-panel">
        <div id="statsMsg" class="stats" aria-live="polite"></div>
        <div class="canvas-wrap">
          <canvas
            id="puzzleCanvas"
            aria-label="Word search puzzle grid"
            aria-hidden="true"
          ></canvas>
          <table
            id="puzzleTable"
            class="visually-hidden"
            aria-label="Word search puzzle grid — text version"
          ></table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
